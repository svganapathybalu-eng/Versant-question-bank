// -------------------------------------------------------------
// PHONETIC & CONNECTED SPEECH NORMALIZATION PIPELINE
// -------------------------------------------------------------
function normalizePhonetics(token) {
  let t = token.toLowerCase().replace(/[^a-z0-9']/g, '');
  const PHONETIC_SYNONYMS = {
    'batch': 'badge', 'batches': 'badges',
    'is shoes': 'issues', 'is shoe': 'issue', 'shoes': 'issues', 'shoe': 'issue',
    'cart': 'card', 'carts': 'cards',
    'gonna': 'going to', 'wanna': 'want to', 'hafta': 'have to',
    'train': 'trained', 'training': 'trained',
    'off': 'of', 'of': 'of',
    'one': 'on', 'on': 'on',
    'checked': 'check', 'fixed': 'fix', 'locked': 'lock', 'moved': 'move',
    'asked': 'ask', 'explained': 'explain', 'delayed': 'delay'
  };
  return PHONETIC_SYNONYMS[t] || t;
}

const norm = s => {
  let str = fix(s).toLowerCase();
  str = str.replace(/\b(is\s+shoes)\b/g, 'issues');
  str = str.replace(/\b(is\s+shoe)\b/g, 'issue');
  str = str.replace(/\b(wanna)\b/g, 'want to');
  str = str.replace(/\b(gonna)\b/g, 'going to');
  return str.replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean).map(normalizePhonetics);
};

const tok = s => fix(s).match(/[A-Za-z0-9']+|[^\sA-Za-z0-9']/g) || [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// -------------------------------------------------------------
// BALANCED DIFFICULTY GENERATOR (GUARANTEES 3-4 HARD ITEMS)
// -------------------------------------------------------------
function sampleBalanced(pool, totalCount, hardTarget = 3) {
  const hardPool = pool.filter(item => item.diff === "hard");
  const stdPool = pool.filter(item => item.diff !== "hard");
  
  const numHard = Math.min(hardTarget, hardPool.length, Math.floor(totalCount / 2));
  const numStd = totalCount - numHard;
  
  const selectedHard = shuffle(hardPool).slice(0, numHard);
  const selectedStd = shuffle(stdPool).slice(0, numStd);
  
  return shuffle([...selectedHard, ...selectedStd]);
}

function buildTestSequence(mode, drillPart) {
  activeItems = [];
  if (mode === 'drill') {
    const targetCount = T_CONFIG[drillPart][4];
    const hardCount = targetCount >= 10 ? 3 : (targetCount >= 4 ? 2 : 1);
    const pool = sampleBalanced(BANK[drillPart], targetCount, hardCount);
    pool.forEach((item, idx) => {
      const dataPayload = item.p ? item.p : item.text;
      activeItems.push({ part: drillPart, data: dataPayload, origIdx: idx, diff: item.diff });
    });
  } else {
    for (const p of 'ABCDEF') {
      const targetCount = T_CONFIG[p][4];
      const hardCount = targetCount >= 12 ? 4 : (targetCount >= 8 ? 3 : 1);
      const sampled = sampleBalanced(BANK[p], targetCount, hardCount);
      sampled.forEach((item, idx) => {
        const dataPayload = item.p ? item.p : item.text;
        activeItems.push({ part: p, data: dataPayload, origIdx: idx, diff: item.diff });
      });
    }
  }
}

let V = [], voiceUS = null, voiceGB = null;

function loadVoices() {
  try {
    if (!window.speechSynthesis) return;
    V = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    voiceGB = V.find(v => /en-GB/i.test(v.lang) && /george|hazel|susan|uk|british|natural/i.test(v.name)) ||
              V.find(v => /en-GB/i.test(v.lang)) || V.find(v => /en-AU/i.test(v.lang));
    voiceUS = V.find(v => /en-US/i.test(v.lang) && /david|zira|mark|us|american|natural/i.test(v.name)) ||
              V.find(v => /en-US/i.test(v.lang)) || V[0];
  } catch (e) {}
}
loadVoices();
if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function playCueTone(token) {
  return new Promise(resolve => {
    if (token !== currentSessionToken) return resolve();
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();

      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, actx.currentTime);
      gain.gain.setValueAtTime(0.18, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.35);

      setTimeout(() => {
        try { actx.close(); } catch(e) {}
        if (token === currentSessionToken) resolve();
      }, 380);
    } catch (e) {
      resolve();
    }
  });
}

function speakText(text, isBritish, pitch = 1, rate = 0.95, token) {
  return new Promise(resolve => {
    if (!window.speechSynthesis || token !== currentSessionToken) return resolve();
    if (speechSynthesis.paused) speechSynthesis.resume();

    const u = new SpeechSynthesisUtterance(text);
    const chosenVoice = isBritish ? (voiceGB || voiceUS) : (voiceUS || voiceGB);
    if (chosenVoice) {
      u.voice = chosenVoice;
      u.lang = chosenVoice.lang;
    } else {
      u.lang = isBritish ? 'en-GB' : 'en-US';
    }
    u.pitch = isBritish ? (pitch * 1.06) : (pitch * 0.94);
    u.rate = rate;

    let timer = setTimeout(resolve, 14000);
    u.onend = () => { clearTimeout(timer); resolve(); };
    u.onerror = () => { clearTimeout(timer); resolve(); };

    speechSynthesis.speak(u);
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function playTaskAudio(part, data, i, token) {
  await wait(250);
  if (token !== currentSessionToken) return;

  const isBritish = (i % 2 === 1);

  if (part === 'A' || part === 'E') {
    await speakText(data, isBritish, 1, part === 'E' ? 0.92 : 0.95, token);
  } else if (part === 'B') {
    for (const chunk of data[0]) {
      if (token !== currentSessionToken) return;
      await speakText(chunk, isBritish, 1, 0.95, token);
      await wait(500);
      if (token !== currentSessionToken) return;
    }
  } else if (part === 'C') {
    const [lines, q] = data;
    for (let k = 0; k < lines.length; k++) {
      if (token !== currentSessionToken) return;
      const speakerIsUK = (k % 2 === 1);
      const pitch = speakerIsUK ? 1.15 : 0.92;
      await speakText(lines[k], speakerIsUK, pitch, 0.95, token);
      await wait(350);
      if (token !== currentSessionToken) return;
    }
    if (token !== currentSessionToken) return;
    await speakText("Question. " + q, false, 1, 0.95, token);
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function initRec() {
  if (rec || !SR) return;
  try {
    rec = new SR();
    rec.lang = 'en-IN';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 5;

    rec.onspeechstart = () => { meta.ts = Date.now(); };
    rec.onspeechend = () => { meta.te = Date.now(); };

    rec.onresult = e => {
      let fullFinal = '', fullInterim = '';
      meta.alternatives = [];

      for (let i = e.resultIndex; i < e.results.length; ++i) {
        const res = e.results[i];
        for (let alt = 0; alt < res.length; alt++) {
          if (res[alt] && res[alt].transcript) {
            meta.alternatives.push(res[alt].transcript.trim());
          }
        }
        if (res.isFinal) {
          fullFinal += res[0].transcript + ' ';
          meta.conf = res[0].confidence;
        } else {
          fullInterim += res[0].transcript;
        }
      }

      const combined = (fullFinal + fullInterim).trim();
      meta.txt = combined;
      if ($('ans')) $('ans').value = combined;
      if ($('note')) $('note').textContent = '';
    };

    rec.onerror = e => {
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        if ($('note')) $('note').textContent = 'Audio notice (' + e.error + '). Continue speaking clearly.';
      }
    };

    rec.onend = () => {
      try { rec.started = false; } catch (e) {}
    };
  } catch (err) {}
}

function stopMicImmediately() {
  if (rec) {
    try { rec.abort(); } catch (e) {}
  }
  if ($('recind')) $('recind').classList.remove('live');
}

function startMicCapture() {
  if (!SR) {
    if ($('note')) $('note').textContent = 'Speech recognition requires Chrome or Edge.';
    return;
  }
  initRec();
  stopMicImmediately();
  try {
    rec.start();
    if ($('note')) $('note').textContent = 'Recording active. Speak now...';
    if ($('recind')) $('recind').classList.add('live');
  } catch (e) {
    setTimeout(() => {
      try {
        rec.start();
        if ($('note')) $('note').textContent = 'Recording active. Speak now...';
        if ($('recind')) $('recind').classList.add('live');
      } catch (e2) {}
    }, 150);
  }
}

      <div class="panel">
        <div class="part-hd"><b>Part ${p}: ${t[0]}</b><span>${t[1]}</span></div>
        <div class="instr">${t[2]}</div>
        <div class="btnrow"><button class="pri" onclick="showItem()">Continue</button></div>
      </div>
    `;
    return;
  }

  let h = bar() + `<div class="panel"><div class="part-hd"><b>Part ${p}: ${t[0]}</b><span>${t[1]}</span></div>`;

  if (p === 'D') {
    h += `
      <p class="qtext">${esc(data[0])}</p>
      ${ring(25)}
      <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type one word">
      <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
    `;
  } else if (p === 'F') {
    h += `
      <div id="fb">
        <div class="no-copy" oncopy="return false" oncut="return false" oncontextmenu="return false">
          <p class="qtext" style="line-height:1.6;background:#FAFBFD;padding:16px;border:1px solid var(--line);border-radius:4px">${esc(data[0])}</p>
        </div>
        <p class="mut">This passage will disappear after 30 seconds. Do not write or take notes.</p>
        ${ring(30)}
        <div class="btnrow"><button class="pri" onclick="fw()">I Have Finished Reading</button></div>
      </div>
    `;
  } else {
    h += `
      <div class="rec" id="recind">
        <span class="dot"></span>
        <span id="st">Playing audio…</span>
      </div>
      ${ring(t[3] || 1)}
    `;

    if (p === 'E') {
      h += `<textarea id="ans" autocomplete="off" spellcheck="false" placeholder="Type the sentence exactly as you heard it"></textarea>`;
    } else {
      h += `
        <div style="margin:12px 0 6px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <label class="mut" style="font-size:.78rem;font-weight:700;text-transform:uppercase">Spoken Response (Voice Captured):</label>
            <button class="speak-again-btn" type="button" onclick="speakAgain()">↺ Speak Again</button>
          </div>
          <input id="ans" autocomplete="off" placeholder="Your spoken words will appear here automatically..." readonly style="background:#F7F9FA;cursor:default;color:#002E3B;font-weight:600">
        </div>
        <p id="note" class="mut" style="min-height:16px"></p>
      `;
    }

    h += `<div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>`;
  }

  $('app').innerHTML = h + '</div>';

  if (p === 'D') {
    cd(25, nx, activeToken);
    $('ans').focus();
  } else if (p === 'F') {
    cd(30, fw, activeToken);
  } else {
    (async () => {
      await playTaskAudio(p, data, n, activeToken);
      if (activeToken !== currentSessionToken) return;

      if (p === 'A' || p === 'B' || p === 'C') {
        await playCueTone(activeToken);
      }
      if (activeToken !== currentSessionToken) return;

      await wait(400);
      if (activeToken !== currentSessionToken) return;

      $('st').textContent = (p === 'E') ? 'Type now' : 'Respond now (Microphone Active)';
      meta.t0 = Date.now();

      cd(t[3], nx, activeToken);

      if (p === 'E') {
        $('ans').focus();
      } else {
        if (SR) {
          startMicCapture();
        }
      }
    })();
  }
}

function fw() {
  currentSessionToken++;
  clearInterval(tm);
  stopMicImmediately();
  $('fb').innerHTML = `
    <p class="mut">Rewrite the passage in your own words below.</p>
    ${ring(90)}
    <textarea id="ans" spellcheck="false" placeholder="Type your answer here"></textarea>
    <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
  `;
  cd(90, nx, currentSessionToken);
  $('ans').focus();
}

function nx() {
  currentSessionToken++;
  clearInterval(tm);
  window.speechSynthesis.cancel();
  stopMicImmediately();

  ans.push($('ans') ?$('ans').value : '');
  mt.push(meta);
  meta = {};
  n++;
  showItem();
}

function mech(v) {
  const s = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  if (!s.length) return 0;
  return s.filter(x => /^[A-Z]/.test(x) && /[.!?]$/.test(x)).length / s.length;
}

function flu(p, m, nwords) {
  if (m.ts == null || m.te == null || !m.t0) return null;
  const lat = (m.ts - m.t0) / 1000;
  const lim = p === 'A' ? 4 : 6;
  const ls = lat <= lim ? 1 : cl(1 - (lat - lim) / lim);
  const d = (m.te - m.ts) / 1000;
  if (d <= 0.3) return ls;
  const w = nwords / d;
  const rate = w >= 1.8 && w <= 3 ? 1 : w < 1.8 ? cl(w / 1.8) : cl(1 - (w - 3) / 1.5);
  return 0.5 * ls + 0.5 * rate;
}

// -------------------------------------------------------------
// ADAPTIVE PHONETIC & MORPHOLOGICAL MATCHER
// -------------------------------------------------------------
function matchWord(refW, userW) {
  if (!refW || !userW) return false;
  if (refW === userW) return true;
  
  // Past tense morphology relaxation (-ed, -d, unreleased plosives)
  if (refW.endsWith('ed') && refW.slice(0, -2) === userW) return true;
  if (refW.endsWith('d') && refW.slice(0, -1) === userW) return true;
  if (userW.endsWith('ed') && userW.slice(0, -2) === refW) return true;
  
  // Plural/singular agreement relaxation
  if (refW.endsWith('s') && refW.slice(0, -1) === userW) return true;
  if (userW.endsWith('s') && userW.slice(0, -1) === refW) return true;

  // Connected speech reduction & preposition assimilation
  const WEAK_PAIRS = [
    ['of', 'have'], ['of', 'off'], ['for', 'four'], ['to', 'too'], ['in', 'an'], ['and', 'an']
  ];
  if (WEAK_PAIRS.some(([a, b]) => (refW === a && userW === b) || (refW === b && userW === a))) {
    return true;
  }
  
  // Levenshtein distance 1 match for minor phonetic shifts
  const len = Math.max(refW.length, userW.length);
  if (Math.abs(refW.length - userW.length) <= 1 && len >= 3) {
    return (lcs(refW, userW) / len) >= 0.78;
  }
  return false;
}

function wordLcs(targetWords, userWords) {
  const m = targetWords.length, n = userWords.length;
  const dp = Array(m + 1).fill(0).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (matchWord(targetWords[i - 1], userWords[j - 1])) {
        dp[i][j] = dp[i - 1][j - 1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
  }
  return dp[m][n];
}

function flexibleRat(targetWords, userWords) {
  const common = wordLcs(targetWords, userWords);
  return common / Math.max(targetWords.length, userWords.length, 1);
}

function flexibleBag(targetWords, userWords) {
  const c = [...userWords];
  let matches = 0;
  targetWords.forEach(tw => {
    const idx = c.findIndex(uw => matchWord(tw, uw));
    if (idx > -1) {
      c.splice(idx, 1);
      matches++;
    }
  });
  return matches / (targetWords.length || 1);
}

function scoreItem(curr, v, m) {
  const p = curr.part;
  const x = curr.data;
  m = m || {};

  const candidateTranscripts = [v];
  if (m.alternatives && Array.isArray(m.alternatives)) {
    m.alternatives.forEach(alt => {
      if (!candidateTranscripts.includes(alt)) candidateTranscripts.push(alt);
    });
  }

  if (p === 'A' || p === 'B') {
    const targetNorms = (p === 'A') ? [norm(x)] : x[1].map(norm);
    let bestSm = 0, bestVo = 0;

    candidateTranscripts.forEach(trans => {
      const userNorm = norm(trans);
      targetNorms.forEach(tNorm => {
        const sm = flexibleRat(tNorm, userNorm);
        const vo = flexibleBag(tNorm, userNorm);
        if (sm > bestSm) bestSm = sm;
        if (vo > bestVo) bestVo = vo;
      });
    });

    const userWordCount = norm(v).length;
    return {
      sm: bestSm,
      vo: bestVo,
      fl: flu(p, m, userWordCount),
      pr: m.conf ? cl((m.conf - 0.58) / 0.32) : 0.8
    };
  }

  if (p === 'C') {
    const isCorrect = candidateTranscripts.some(trans => {
      const transLo = trans.toLowerCase();
      const transNorm = norm(trans);
      return x[2].some(k => {
        const kNorm = normalizePhonetics(k);
        return transNorm.includes(kNorm) || (k.length > 3 && transLo.includes(k));
      });
    });
    return { c: isCorrect ? 1 : 0 };
  }

  if (p === 'D') {
    const cleaned = fix(v).toLowerCase();
    return { d: x[1].some(acc => acc.toLowerCase() === cleaned) ? 1 : 0 };
  }

  if (p === 'E') {
    const a = tok(x), b = tok(v);
    const pa = a.filter(t => /^[^A-Za-z0-9']/.test(t));
    const pb = b.filter(t => /^[^A-Za-z0-9']/.test(t));
    return {
      lis: bag(norm(x), norm(v)),
      sp: rat(norm(x), norm(v)),
      cap: bag(a.filter(t => /^[A-Z]/.test(t)), b),
      pu: lcs(pa, pb) / Math.max(pa.length, pb.length, 1)
    };
  }

  const lo = v.toLowerCase(), w = norm(v);
  const cov = x[1].filter(g => g.some(k => lo.includes(k))).length / x[1].length;
  const ln = cl((w.length - 0.5 * norm(x[0]).length) / (0.35 * norm(x[0]).length));
  const ss = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  const lk = ss.filter(z => /\b(because|but|and|so|although|while|which|who|when|after|before|then|however)\b/i.test(z)).length / (ss.length || 1);
  return {
    cov,
    con: cov * ln,
    mech: mech(v),
    va: 0.5 * cl(new Set(w).size / (w.length || 1) / 0.85) * ln + 0.5 * cl(lk / 0.5)
  };
}

const K_SKILLS = {
  Speaking: [
    ['Sentence mastery', 'A, B', 'AB', 'sm', 0.3],
    ['Vocabulary', 'A, B', 'AB', 'vo', 0.2],
    ['Fluency', 'A, B (mic)', 'AB', 'fl', 0.25],
    ['Pronunciation', 'A, B (mic)', 'AB', 'pr', 0.25]
  ],
  Listening: [
    ['Understanding conversations', 'C', 'C', 'c', 0.5],
    ['Understanding spoken sentences', 'E', 'E', 'lis', 0.5]
  ],
  Reading: [
    ['Vocabulary and grammar in context', 'D', 'D', 'd', 0.6],
    ['Passage comprehension', 'F', 'F', 'cov', 0.4]
  ],
  Writing: [
    ['Spelling', 'E', 'E', 'sp', 0.2],
    ['Capitalisation', 'E', 'E', 'cap', 0.15],
    ['Punctuation', 'E', 'E', 'pu', 0.15],
    ['Content and sequence', 'F', 'F', 'con', 0.2],
    ['Capitals and full stops', 'F', 'F', 'mech', 0.1],
    ['Vocabulary and sentence variety', 'F', 'F', 'va', 0.2]
  ]
};

const band = o => o < 30 ? 'A1' : o < 42 ? 'A2' : o < 54 ? 'B1' : o < 66 ? 'B2' : 'C1';
const toGSE = s => Math.round(10 + ((s - 20) / 60) * 80);

function lcs(a,b){const d=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[a.length][b.length]}
const rat=(a,b)=>lcs(a,b)/Math.max(a.length,b.length,1);
const cl=x=>Math.max(0,Math.min(1,x));
const bag=(t,r)=>{const c=[...r];let k=0;t.forEach(w=>{const i=c.indexOf(w);if(i>-1){c.splice(i,1);k++}});return k/(t.length||1)};
function gauge(label,val){const pct=val==null?null:Math.round(val*100);return `<tr><td>${label}</td><td>${pct==null?'Not assessed':pct+'%'}</td></tr>`}

function finish() {
  const it = { A: [], B: [], C: [], D: [], E: [], F: [] };
  let rv = '';

  activeItems.forEach((curr, k) => {
    const v = ans[k] || '';
    const o = scoreItem(curr, v, mt[k]);
    it[curr.part].push(o);

    const c = (curr.part === 'A' || curr.part === 'E') ? curr.data
      : (curr.part === 'B') ? curr.data[1][0]
      : (curr.part === 'C') ? curr.data[1] + ' → ' + curr.data[2].join('/')
      : (curr.part === 'D') ? curr.data[0] + ' → ' + curr.data[1].join('/')
      : curr.data[0];

    rv += `<tr><td>${curr.part}${k + 1}</td><td>${esc(v || '(blank)')}</td><td>${esc(c)}</td><td>${Object.values(o).filter(z => z != null).map(z => Math.round(z * 100) + '%').join(' / ')}</td></tr>`;
  });

  const av = (ps, key) => {
    const z = ps.flatMap(p => it[p].map(o => o[key])).filter(z => z != null);
    return z.length ? z.reduce((a, b) => a + b, 0) / z.length : null;
  };

  let cards = '', tot = 0, skillPct = {}, subscores = {};
  for (const s in K_SKILLS) {
    const rows = K_SKILLS[s].map(r => ({ l: r[0], f: r[1], w: r[4], v: av(r[2].split(''), r[3]) }));
    const ok = rows.filter(r => r.v != null);
    const pct = ok.length ? ok.reduce((a, r) => a + r.v * r.w, 0) / ok.reduce((a, r) => a + r.w, 0) : 0;
    const curved = Math.pow(pct, 1.3);
    const sco = Math.round(20 + 60 * curved);
    tot += sco;
    skillPct[s] = pct;
    subscores[s] = sco;

    cards += `
      <div class="panel">
        <div class="part-hd"><b>${s}</b><span class="badge">${sco} / 80 &nbsp;·&nbsp; GSE: ${toGSE(sco)}/90 &nbsp;·&nbsp; ${band(sco)}</span></div>
        <table><tr><th>Sub-skill</th><th>Score</th></tr>${rows.map(r => gauge(r.l, r.v)).join('')}</table>
      </div>
    `;
  }

  const O = Math.round(tot / 4);

  let lsrw = '';
  for (const s2 in K_SKILLS) {
    const sco = subscores[s2];
    lsrw += `
      <div class="skill-card">
        <div class="sk-name">${s2}</div>
        <div class="sk-num">${sco}<span style="font-size:.9rem;color:var(--mut)"> / 80</span></div>
        <div class="sk-bar"><i style="width:${Math.round(100 * (sco - 20) / 60)}%"></i></div>
        <div class="mut" style="margin-top:4px">GSE: ${toGSE(sco)} · ${band(sco)}</div>
      </div>
    `;
  }

  $('app').innerHTML = `
    <div class="score-hd">
      <div class="lbl">Assessment Overall Score</div>
      <div class="num">${O}</div>
      <div class="lbl">out of 80 &nbsp;·&nbsp; ${band(O)}</div>
      <div class="score-sub">Global Scale of English (GSE): ${toGSE(O)} / 90</div>
    </div>
    <div class="lsrw">${lsrw}</div>
    <div class="panel"><details open><summary>Sub-skill Diagnostics</summary><div style="margin-top:12px">${cards}</div></details></div>
    <div class="panel"><details><summary>Review Item Audit (${activeItems.length} total)</summary><div style="overflow-x:auto;margin-top:10px"><table><tr><th>Item</th><th>Your Answer</th><th>Target</th><th>Sub-scores</th></tr>${rv}</table></div></details></div>
    <div class="btnrow" style="margin:16px">
      <button onclick="window.print()">Print Score Report (PDF)</button>
      <button class="pri" onclick="intro()">Return to Home</button>
    </div>
  `;
}

intro();
</script>

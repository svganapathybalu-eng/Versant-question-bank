    ["Farah noticed that the office recycling bins were rarely used. She spoke to her manager about placing clearer labels on each bin. Within two weeks, more employees started sorting their waste correctly, and the office reduced its general waste by nearly a third.", [["farah"], ["recycling"], ["bin", "bins"], ["manager"], ["label", "labels"], ["two weeks", "2 weeks"], ["waste"], ["third", "30", "one third"]]],
    ["A small clinic in a rural town began offering free health check-ups on the first Sunday of every month. The idea started when the local doctor noticed that many residents avoided visits due to cost. Word spread quickly, and within six months, over three hundred people had attended at least one check-up.", [["clinic"], ["rural", "town"], ["free"], ["check-up", "checkup", "check up"], ["sunday"], ["doctor"], ["cost"], ["six months", "6 months"], ["three hundred", "300"]]],
    ["Rohan realized that new scholars struggled to remember the voice queue procedures during their first week. He designed a simplified quick-reference card that clipped directly onto their monitors. Within a month, customer hold times decreased significantly and first-call resolution improved across the entire team.", [["rohan"], ["scholar", "scholars"], ["voice", "queue"], ["card", "reference"], ["hold"], ["month"], ["resolution"], ["team"]]],
    ["Anita discovered that trainees often misplaced physical access keys to the simulation training suites. She proposed installing numerical keypad locks programmed with temporary passcodes sent by email. The facilities director approved the pilot system, which eliminated duplicate key expenses and saved fifteen minutes each morning.", [["anita"], ["trainee", "trainees"], ["keys", "key"], ["locks", "lock"], ["passcode", "code"], ["facilities"], ["fifteen minutes", "15 minutes"]]],
    ["Deepak observed that meeting rooms were frequently booked on the calendar but remained empty during the scheduled hours. He introduced an automated check-in sensor that released reservations if nobody checked in within ten minutes. As a result, meeting room availability increased by forty percent across the floor.", [["deepak"], ["meeting", "rooms"], ["booked", "reservations"], ["empty"], ["sensor", "check-in"], ["ten minutes", "10 minutes"], ["forty percent", "40%"]]],
    ["Pooja suggested creating an internal library of recorded customer escalations for new onboarding batches. She organized forty short audio recordings categorized by product issue and customer emotion. Trainees who reviewed the audio library achieved target call handling standards two weeks earlier than previous groups.", [["pooja"], ["library", "audio"], ["customer"], ["escalations", "recordings"], ["forty", "40"], ["two weeks", "2 weeks"], ["call", "standards"]]],
    ["Vikram noticed that cafeteria lines were excessively long during the lunch rush. He worked with the kitchen staff to introduce pre-packaged meal boxes for quick grab-and-go pickup. Within a week, lunchtime waiting queues were reduced from twenty minutes down to less than five.", [["vikram"], ["cafeteria", "lunch"], ["lines", "queues"], ["boxes", "meal"], ["twenty minutes", "20 minutes"], ["five minutes", "5 minutes"]]],
    ["Sneha recognized that new employees were overwhelmed by lengthy email attachments containing company policies. She transformed forty pages of documentation into six short visual infographics published on the internal wiki. Staff comprehension of safety protocols doubled over the following quarterly survey.", [["sneha"], ["employees", "staff"], ["policies", "documentation"], ["infographics", "visual"], ["six", "6"], ["safety", "protocols"], ["doubled"]]],
    ["Karan identified that conference room projector bulbs burned out quickly because people forgot to power them down after meetings. He configured an automated ten-minute inactivity shutdown on all projectors. This small technical change extended projector bulb life and reduced annual equipment replacement costs significantly.", [["karan"], ["projector", "projectors"], ["forgot", "power"], ["ten-minute", "10 minutes"], ["shutdown", "inactivity"], ["costs", "replacement"]]],
    ["Meera established a peer buddy system where experienced scholars supported newly joined trainees during their first client calls. Buddies sat alongside trainees to offer silent reassurance and quick notes on complex tickets. Within three weeks, trainee confidence ratings jumped by over fifty percent.", [["meera"], ["buddy", "system"], ["scholars", "trainees"], ["calls", "client"], ["tickets"], ["three weeks", "3 weeks"], ["fifty percent", "50%"]]],
    ["Sunil noticed that technical support engineers spent excessive time searching for legacy software installation packages. He created a centralized digital repository organized by version number and release date. The new repository saved each engineer approximately thirty minutes of troubleshooting time every week.", [["sunil"], ["engineers"], ["software", "packages"], ["repository", "centralized"], ["version", "date"], ["thirty minutes", "30 minutes"]]],
    ["Kavita saw that scholars often hesitated to speak during daily morning meetings because they feared making grammatical errors. She introduced a daily five-minute tongue twister challenge before each shift began. Within four weeks, scholars reported feeling much more relaxed and natural during client voice calls.", [["kavita"], ["scholars", "meetings"], ["hesitated", "errors"], ["tongue twister", "challenge"], ["five-minute", "5 minutes"], ["four weeks", "4 weeks"], ["relaxed", "voice calls"]]],
    ["Asha noticed that trainees frequently forgot to mute their microphones during large online training webinars. She created a simple popup notification reminding scholars to check audio settings before entering the virtual room. This reduced background disruptions by eighty percent across all online training batches.", [["asha"], ["trainees"], ["mute", "microphones"], ["popup", "notification"], ["online", "webinars"], ["disruptions"], ["eighty percent", "80%"]]],

const fix = s => String(s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').trim();

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildTestSequence(mode, drillPart) {
  activeItems = [];
  if (mode === 'drill') {
    // Fisher-Yates shuffle across the dedicated DRILL_BANK pool
    const pool = shuffle(DRILL_BANK[drillPart]);
    pool.forEach((item, idx) => activeItems.push({ part: drillPart, data: item, origIdx: idx }));

    // Official 70-Item Mock: 16 Repeats, 8 Builds, 12 Convs, 18 Completions, 14 Dictations, 2 Reconstructions
    const counts = { A: 16, B: 8, C: 12, D: 18, E: 14, F: 2 };
    for (const p of 'ABCDEF') {
      const sampled = shuffle(MOCK_BANK[p]).slice(0, counts[p]);
      sampled.forEach((item, idx) => activeItems.push({ part: p, data: item, origIdx: idx }));

// AUDIO SYNTHESIS & IMMEDIATE-CANCEL ENGINE
// -------------------------------------------------------------
let V = [], voiceUS = null, voiceGB = null, voiceAU = null;

function loadVoices() {
  try {
    if (!window.speechSynthesis) return;
    V = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    voiceUS = V.find(v => /en-US/i.test(v.lang)) || V[0];
    voiceGB = V.find(v => /en-GB/i.test(v.lang)) || voiceUS;
    voiceAU = V.find(v => /en-AU/i.test(v.lang)) || voiceGB;
  } catch (e) {}
}
loadVoices();
if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function playCueTone(token) {
  return new Promise(resolve => {
    if (token !== currentSessionToken) return resolve();
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();

      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, actx.currentTime);
      gain.gain.setValueAtTime(0.18, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.35);

      setTimeout(() => {
        try { actx.close(); } catch(e) {}
        if (token === currentSessionToken) resolve();
      }, 380);
    } catch (e) {
      resolve();
    }
  });
}

function speakText(text, voiceChoice, pitch = 1, rate = 0.95, token) {
  return new Promise(resolve => {
    if (!window.speechSynthesis || token !== currentSessionToken) return resolve();
    if (speechSynthesis.paused) speechSynthesis.resume();

    const u = new SpeechSynthesisUtterance(text);
    if (voiceChoice) {
      u.voice = voiceChoice;
      u.lang = voiceChoice.lang;
    }
    u.pitch = pitch;
    u.rate = rate;

    let timer = setTimeout(resolve, 12000);
    u.onend = () => { clearTimeout(timer); resolve(); };
    u.onerror = () => { clearTimeout(timer); resolve(); };

    speechSynthesis.speak(u);
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function playTaskAudio(part, data, i, token) {
  await wait(250);
  if (token !== currentSessionToken) return;

  const voices = [voiceUS, voiceGB, voiceAU].filter(Boolean);
  const v = voices[i % voices.length] || voiceUS;

  if (part === 'A' || part === 'E') {
    await speakText(data, v, 1, part === 'E' ? 0.92 : 0.95, token);
  } else if (part === 'B') {
    for (const chunk of data[0]) {
      if (token !== currentSessionToken) return;
      await speakText(chunk, v, 1, 0.95, token);
      await wait(500);
      if (token !== currentSessionToken) return;
    }
  } else if (part === 'C') {
    const [lines, q] = data;
    for (let k = 0; k < lines.length; k++) {
      if (token !== currentSessionToken) return;
      const spkVoice = (k % 2 === 0) ? (voiceUS || v) : (voiceGB || v);
      const pitch = (k % 2 === 0) ? 0.95 : 1.15;
      await speakText(lines[k], spkVoice, pitch, 0.95, token);
      await wait(350);
      if (token !== currentSessionToken) return;
    }
    if (token !== currentSessionToken) return;
    await speakText("Question. " + q, voiceUS, 1, 0.95, token);
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function initRec() {
  if (rec || !SR) return;
  try {
    rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = false;
    rec.interimResults = false;
    rec.onspeechstart = () => { meta.ts = Date.now(); };
    rec.onspeechend = () => { meta.te = Date.now(); };
    rec.onresult = e => {
      const r = e.results[0][0];
      meta.conf = r.confidence;
      meta.txt = r.transcript.trim();
      if ($('ans')) $('ans').value = r.transcript;
      if ($('note')) $('note').textContent = '';
    };
    rec.onerror = () => {
      if ($('note')) $('note').textContent = 'Microphone busy. Type response or re-click Use Microphone.';
    };
    rec.onend = () => {
      try { rec.started = false; } catch (e) {}
    };
  } catch (err) {}
}

function stopMicImmediately() {
  if (rec) {
    try { rec.abort(); } catch (e) {}
  }
}

function startMicCapture() {
  if (!SR) {
    if ($('note')) $('note').textContent = 'Speech recognition not supported in this browser. Please type response.';
    return;
  }
  initRec();
  stopMicImmediately();
  try {
    rec.start();
    if ($('note')) $('note').textContent = 'Listening to your response...';
    if ($('recind')) $('recind').classList.add('live');
  } catch (e) {
    setTimeout(() => {
      try {
        rec.start();
        if ($('note')) $('note').textContent = 'Listening to your response...';
        if ($('recind')) $('recind').classList.add('live');
      } catch (e2) {}
    }, 150);
  }
}

  if (p === 'D') {
    h += `
      <p class="qtext">${esc(data[0])}</p>
      ${ring(25)}
      <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type one word">
      <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
    `;
  } else if (p === 'F') {
    h += `
      <div id="fb">
        <p class="qtext">${esc(data[0])}</p>
        <p class="mut">This passage will be removed automatically after 30 seconds.</p>
        ${ring(30)}
        <div class="btnrow"><button class="pri" onclick="fw()">I Have Finished Reading</button></div>
      </div>
    `;
  } else {
    h += `
      <div class="rec" id="recind">
        <span class="dot"></span>
        <span id="st">Playing audio…</span>
      </div>
      ${ring(t[3] || 1)}
    `;

    if (p === 'E') {
      h += `<textarea id="ans" autocomplete="off" spellcheck="false" placeholder="Type the sentence exactly as you heard it"></textarea>`;
    } else {
      h += `
        <div class="fallback-row">
          <span>Microphone activates automatically after the tone.</span>
          <label style="cursor:pointer"><input type="checkbox" id="tbFb" onchange="toggleFallback(this.checked)" ${forceManualInput ? 'checked' : ''}> Type answer</label>
        </div>
        <div class="btnrow" style="justify-content:flex-start;border:none;padding-top:2px">
          <button onclick="startMicCapture()">Use Microphone</button>
        </div>
        <input id="ans" autocomplete="off" placeholder="Your response" ${forceManualInput ? '' : 'readonly'}>
        <p id="note" class="mut" style="min-height:16px"></p>
      `;
    }

    h += `<div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>`;
  }

  $('app').innerHTML = h + '</div>';

  if (p === 'D') {
    cd(25, nx, activeToken);
    $('ans').focus();
  } else if (p === 'F') {
    cd(30, fw, activeToken);
  } else {
    (async () => {
      // 1. Play audio prompt while microphone remains strictly off
      await playTaskAudio(p, data, n, activeToken);
      if (activeToken !== currentSessionToken) return;

      // 2. Play 880Hz cue tone
      if (p === 'A' || p === 'B' || p === 'C') {
        await playCueTone(activeToken);
      }
      if (activeToken !== currentSessionToken) return;

      // 3. NOW OPEN MICROPHONE FOR THE SCHOLAR
      $('st').textContent = (p === 'E') ? 'Type now' : 'Respond now (Microphone Active)';
      meta.t0 = Date.now();

      cd(t[3], nx, activeToken);

      if (p === 'E') {
        $('ans').focus();
      } else {
        if (!forceManualInput && SR) {
          startMicCapture();
        }
      }
    })();
  }
}

function toggleFallback(checked) {
  forceManualInput = checked;
  if ($('ans')) {
    if (checked) {
      stopMicImmediately();
      $('ans').removeAttribute('readonly');
      $('ans').placeholder = 'Type your answer here...';$('ans').focus();
    } else {
      $('ans').setAttribute('readonly', 'true');$('ans').placeholder = 'Your response';
    }
  }
}

function fw() {
  currentSessionToken++;
  clearInterval(tm);
  stopMicImmediately();
  $('fb').innerHTML = `
    <p class="mut">Rewrite the passage in your own words below.</p>
    ${ring(90)}
    <textarea id="ans" spellcheck="false" placeholder="Type your answer here"></textarea>
    <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
  `;
  cd(90, nx, currentSessionToken);
  $('ans').focus();
}

function nx() {
  currentSessionToken++;
  clearInterval(tm);
  window.speechSynthesis.cancel();
  stopMicImmediately();

  ans.push($('ans') ?$('ans').value : '');
  mt.push(meta);
  meta = {};
  n++;
  showItem();
}

// -------------------------------------------------------------
// SCORING ENGINE
// -------------------------------------------------------------
function mech(v) {
  const s = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  if (!s.length) return 0;
  return s.filter(x => /^[A-Z]/.test(x) && /[.!?]$/.test(x)).length / s.length;
}

function flu(p, m, nwords) {
  if (m.ts == null || m.te == null || !m.t0) return null;
  const lat = (m.ts - m.t0) / 1000;
  const lim = p === 'A' ? 4 : 6;
  const ls = lat <= lim ? 1 : cl(1 - (lat - lim) / lim);
  const d = (m.te - m.ts) / 1000;
  if (d <= 0.3) return ls;
  const w = nwords / d;
  const rate = w >= 1.8 && w <= 3 ? 1 : w < 1.8 ? cl(w / 1.8) : cl(1 - (w - 3) / 1.5);
  return 0.5 * ls + 0.5 * rate;
}

function scoreItem(curr, v, m) {
  const p = curr.part;
  const x = curr.data;
  m = m || {};

  if (p === 'A' || p === 'B') {
    const Ts = (p === 'A') ? [norm(x)] : x[1].map(norm);
    const w = norm(v);
    const k = Ts.map(a => rat(a, w));
    const b = k.indexOf(Math.max(...k));
    const ok = m.txt != null && m.txt.toLowerCase() === v.trim().toLowerCase();
    return {
      sm: k[b],
      vo: bag(Ts[b], w),
      fl: ok ? flu(p, m, w.length) : null,
      pr: ok && m.conf ? cl((m.conf - 0.62) / 0.28) : null
    };
  }
  if (p === 'C') {
    const w = norm(v), lo = v.toLowerCase();
    return { c: x[2].some(k => w.includes(k) || (k.length > 3 && lo.includes(k))) ? 1 : 0 };
  }
  if (p === 'D') {
    const cleaned = fix(v).toLowerCase();
    return { d: x[1].some(acc => acc.toLowerCase() === cleaned) ? 1 : 0 };
  }
  if (p === 'E') {
    const a = tok(x), b = tok(v);
    const pa = a.filter(t => /^[^A-Za-z0-9']/.test(t));
    const pb = b.filter(t => /^[^A-Za-z0-9']/.test(t));
    return {
      lis: bag(norm(x), norm(v)),
      sp: rat(norm(x), norm(v)),
      cap: bag(a.filter(t => /^[A-Z]/.test(t)), b),
      pu: lcs(pa, pb) / Math.max(pa.length, pb.length, 1)
    };
  }

  const lo = v.toLowerCase(), w = norm(v);
  const cov = x[1].filter(g => g.some(k => lo.includes(k))).length / x[1].length;
  const ln = cl((w.length - 0.5 * norm(x[0]).length) / (0.35 * norm(x[0]).length));
  const ss = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  const lk = ss.filter(z => /\b(because|but|and|so|although|while|which|who|when|after|before|then|however)\b/i.test(z)).length / (ss.length || 1);
  return {
    cov,
    con: cov * ln,
    mech: mech(v),
    va: 0.5 * cl(new Set(w).size / (w.length || 1) / 0.85) * ln + 0.5 * cl(lk / 0.5)
  };
}

const K_SKILLS = {
  Speaking: [
    ['Sentence mastery', 'A, B', 'AB', 'sm', 0.3],
    ['Vocabulary', 'A, B', 'AB', 'vo', 0.2],
    ['Fluency', 'A, B (mic)', 'AB', 'fl', 0.25],
    ['Pronunciation', 'A, B (mic)', 'AB', 'pr', 0.25]
  ],
  Listening: [
    ['Understanding conversations', 'C', 'C', 'c', 0.5],
    ['Understanding spoken sentences', 'E', 'E', 'lis', 0.5]
  ],
  Reading: [
    ['Vocabulary and grammar in context', 'D', 'D', 'd', 0.6],
    ['Passage comprehension', 'F', 'F', 'cov', 0.4]
  ],
  Writing: [
    ['Spelling', 'E', 'E', 'sp', 0.2],
    ['Capitalisation', 'E', 'E', 'cap', 0.15],
    ['Punctuation', 'E', 'E', 'pu', 0.15],
    ['Content and sequence', 'F', 'F', 'con', 0.2],
    ['Capitals and full stops', 'F', 'F', 'mech', 0.1],
    ['Vocabulary and sentence variety', 'F', 'F', 'va', 0.2]
  ]
};

const band = o => o < 30 ? 'A1' : o < 42 ? 'A2' : o < 54 ? 'B1' : o < 66 ? 'B2' : 'C1';
const toGSE = s => Math.round(10 + ((s - 20) / 60) * 80);

function lcs(a,b){const d=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[a.length][b.length]}
const rat=(a,b)=>lcs(a,b)/Math.max(a.length,b.length,1);
const cl=x=>Math.max(0,Math.min(1,x));
const bag=(t,r)=>{const c=[...r];let k=0;t.forEach(w=>{const i=c.indexOf(w);if(i>-1){c.splice(i,1);k++}});return k/(t.length||1)};
function gauge(label,val){const pct=val==null?null:Math.round(val*100);return `<tr><td>${label}</td><td>${pct==null?'Not assessed':pct+'%'}</td></tr>`}

// -------------------------------------------------------------
// RESULTS SCREEN
// -------------------------------------------------------------
function finish() {
  const it = { A: [], B: [], C: [], D: [], E: [], F: [] };
  let rv = '';

  activeItems.forEach((curr, k) => {
    const v = ans[k] || '';
    const o = scoreItem(curr, v, mt[k]);
    it[curr.part].push(o);

    const c = (curr.part === 'A' || curr.part === 'E') ? curr.data
      : (curr.part === 'B') ? curr.data[1][0]
      : (curr.part === 'C') ? curr.data[1] + ' → ' + curr.data[2].join('/')
      : (curr.part === 'D') ? curr.data[0] + ' → ' + curr.data[1].join('/')
      : curr.data[0];

    rv += `<tr><td>${curr.part}${k + 1}</td><td>${esc(v || '(blank)')}</td><td>${esc(c)}</td><td>${Object.values(o).filter(z => z != null).map(z => Math.round(z * 100) + '%').join(' / ')}</td></tr>`;
  });

  const av = (ps, key) => {
    const z = ps.flatMap(p => it[p].map(o => o[key])).filter(z => z != null);
    return z.length ? z.reduce((a, b) => a + b, 0) / z.length : null;
  };

  let cards = '', tot = 0, skillPct = {}, subscores = {};
  for (const s in K_SKILLS) {
    const rows = K_SKILLS[s].map(r => ({ l: r[0], f: r[1], w: r[4], v: av(r[2].split(''), r[3]) }));
    const ok = rows.filter(r => r.v != null);
    const pct = ok.length ? ok.reduce((a, r) => a + r.v * r.w, 0) / ok.reduce((a, r) => a + r.w, 0) : 0;
    const curved = Math.pow(pct, 1.3);
    const sco = Math.round(20 + 60 * curved);
    tot += sco;
    skillPct[s] = pct;
    subscores[s] = sco;

    cards += `
      <div class="panel">
        <div class="part-hd"><b>${s}</b><span class="badge">${sco} / 80 &nbsp;·&nbsp; GSE: ${toGSE(sco)}/90 &nbsp;·&nbsp; ${band(sco)}</span></div>
        <table><tr><th>Sub-skill</th><th>Score</th></tr>${rows.map(r => gauge(r.l, r.v)).join('')}</table>
      </div>
    `;
  }

  const O = Math.round(tot / 4);

  let lsrw = '';
  for (const s2 in K_SKILLS) {
    const sco = subscores[s2];
    lsrw += `
      <div class="skill-card">
        <div class="sk-name">${s2}</div>
        <div class="sk-num">${sco}<span style="font-size:.9rem;color:var(--mut)"> / 80</span></div>
        <div class="sk-bar"><i style="width:${Math.round(100 * (sco - 20) / 60)}%"></i></div>
        <div class="mut" style="margin-top:4px">GSE: ${toGSE(sco)} · ${band(sco)}</div>
      </div>
    `;
  }

  $('app').innerHTML = `
    <div class="score-hd">
      <div class="lbl">Assessment Overall Score</div>
      <div class="num">${O}</div>
      <div class="lbl">out of 80 &nbsp;·&nbsp; ${band(O)}</div>
      <div class="score-sub">Global Scale of English (GSE): ${toGSE(O)} / 90</div>
    </div>
    <div class="lsrw">${lsrw}</div>
    <div class="panel"><details open><summary>Sub-skill Diagnostics</summary><div style="margin-top:12px">${cards}</div></details></div>
    <div class="panel"><details><summary>Review Item Audit (${activeItems.length} total)</summary><div style="overflow-x:auto;margin-top:10px"><table><tr><th>Item</th><th>Your Answer</th><th>Target</th><th>Sub-scores</th></tr>${rv}</table></div></details></div>
    <div class="btnrow" style="margin:16px">
      <button onclick="window.print()">Print Score Report (PDF)</button>
      <button class="pri" onclick="intro()">Return to Home</button>
    </div>
  `;
}

// Initial Boot
intro();
</script>

.topbar .brand:hover span.title-link{text-decoration:underline}
.topbar .badge-sim{background:var(--p-accent);color:var(--p-blue);padding:2px 8px;border-radius:3px;font-size:.72rem;font-weight:900;letter-spacing:.05em}
.topbar .tin{font-size:.82rem;font-family:'Courier New',monospace;color:#CFD8DC}
.statusbar{background:#E5ECEF;border-bottom:1px solid var(--line);padding:7px 20px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--mut)}
.bar{height:4px;background:#CFD8DC}
.bar i{display:block;height:100%;background:var(--p-accent);transition:width .2s ease}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:24px 22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.part-hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--p-blue);padding-bottom:10px;margin-bottom:16px}
.part-hd b{color:var(--p-blue);font-size:1.15rem;font-weight:700}
.part-hd span{font-size:.82rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.instr{background:#E8F1F4;border-left:4px solid var(--p-blue);padding:12px 14px;font-size:.9rem;color:#0F333E;margin-bottom:16px}
.qtext{font-size:1.18rem;font-weight:600;margin:14px 0;color:var(--ink);line-height:1.4}
.rec{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--mut);margin:12px 0}
.rec .dot{width:11px;height:11px;border-radius:50%;background:#BBB}
.rec.live .dot{background:var(--red);box-shadow:0 0 0 0 rgba(211,47,47,.6);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(211,47,47,.5)}70%{box-shadow:0 0 0 10px rgba(211,47,47,0)}100%{box-shadow:0 0 0 0 rgba(211,47,47,0)}}

input,textarea,select{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid #B0BEC5;border-radius:3px;background:#fff;color:var(--ink);margin:8px 0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--p-blue);box-shadow:0 0 0 2px rgba(0,46,59,.15)}
textarea{min-height:120px;font-family:inherit}
.btnrow{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
button{font:inherit;font-weight:600;padding:9px 22px;border-radius:3px;border:1px solid #B0BEC5;background:#fff;color:var(--ink);cursor:pointer;transition:.15s ease}
button:hover{background:#ECEFF1}
button.pri{background:var(--p-blue);color:#fff;border-color:var(--p-blue)}
button.pri:hover{background:var(--p-blue-light)}
button.sec-sm{font-size:.8rem;padding:6px 14px;background:#F1F5F7;border-color:#CFD8DC;color:var(--p-blue)}
button.sec-sm:hover{background:#E1E8EC}
button.warn-sm{font-size:.8rem;padding:6px 12px;background:#FFF3E0;border-color:#FFE0B2;color:#E65100;font-weight:700}
button.warn-sm:hover{background:#FFE0B2}
.mut{color:var(--mut);font-size:.85rem}
.center{text-align:center}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#E8EFF2;color:var(--p-blue);font-weight:700}
.score-hd{background:var(--p-blue);color:#fff;padding:22px 20px;text-align:center;border-radius:4px 4px 0 0}
.score-hd .num{font-size:3.2rem;font-weight:800;font-family:'Courier New',monospace;line-height:1;margin:4px 0}
.score-hd .lbl{font-size:.85rem;letter-spacing:.08em;opacity:.9;text-transform:uppercase}
.score-sub{color:var(--p-accent);font-weight:700;font-size:.95rem;margin-top:4px}
.lsrw{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-top:none;background:#fff;margin-bottom:16px}
.skill-card{padding:16px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.skill-card:nth-child(2n){border-right:none}
.sk-name{font-weight:700;color:var(--p-blue);font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
.sk-num{font-size:1.8rem;font-weight:800;font-family:'Courier New',monospace;margin:4px 0}
.sk-bar{height:6px;background:#E0E0E0;border-radius:3px;overflow:hidden}
.sk-bar i{display:block;height:100%;background:var(--p-accent)}
.badge{font-size:.74rem;border:1px solid var(--line);padding:2px 8px;border-radius:3px;color:var(--mut);background:#FAFCFD}
details summary{cursor:pointer;font-weight:700;color:var(--p-blue)}
.tag-mode{display:inline-block;padding:2px 7px;border-radius:3px;font-size:.72rem;font-weight:700;text-transform:uppercase;margin-left:8px}
.tag-mock{background:#E0F2F1;color:#004D40}
.tag-drill{background:#FFF3E0;color:#E65100}
.drill-card{background:#FAFBFD;border:1px solid var(--line);border-radius:4px;padding:16px;margin:16px 0}
.env-box{background:#FFF9E6;border-left:4px solid var(--p-accent);padding:12px 14px;border-radius:2px;margin:14px 0;font-size:.88rem;color:#7A5500}
.env-box ul{margin:6px 0 0 18px;padding:0}
.no-copy{

const fix = s => String(s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').trim();

function phoneticRepair(recognized, target) {
  if (!recognized || !target) return recognized;
  const userWords = recognized.split(/\s+/);
  const targetWords = target.toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);

  const repaired = userWords.map(w => {
    const cleanW = w.toLowerCase().replace(/[^a-z0-9']/g, '');
    for (const tw of targetWords) {
      if (cleanW === tw) return tw;
      if (tw.endsWith('ed') && tw.slice(0, -2) === cleanW) return tw;
      if (tw.endsWith('d') && tw.slice(0, -1) === cleanW) return tw;
      if (tw.endsWith('s') && tw.slice(0, -1) === cleanW) return tw;
      if ((cleanW === 'batch' && tw === 'badge') || (cleanW === 'badge' && tw === 'batch')) return tw;
      if ((cleanW === 'shoes' || cleanW === 'shoe') && tw === 'issues') return tw;
      if (cleanW === 'cart' && tw === 'card') return tw;
      if (cleanW === 'off' && tw === 'of') return tw;
      if (cleanW.length >= 4 && tw.length >= 4 && Math.abs(cleanW.length - tw.length) <= 1) {
        if (lcs(cleanW, tw) >= Math.max(cleanW.length, tw.length) - 1) return tw;
      }
    }
    return w;
  });

  return repaired.join(' ');
}

const norm = s => {
  let str = fix(s).toLowerCase();
  str = str.replace(/\b(is\s+shoes)\b/g, 'issues');
  str = str.replace(/\b(is\s+shoe)\b/g, 'issue');
  return str.replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sampleTiered(pool, totalCount, hardTarget) {
  const isHard = item => {
    if (typeof item === 'string') return item.startsWith('[HARD]');
    if (Array.isArray(item)) {
      if (Array.isArray(item[0])) {
        const first = item[0][0];
        return typeof first === 'string' && first.startsWith('[HARD]');
      }
      return typeof item[0] === 'string' && item[0].startsWith('[HARD]');
    }
    return false;
  };

  const hardItems = pool.filter(isHard);
  const normalItems = pool.filter(i => !isHard(i));

  const sampledHard = shuffle(hardItems).slice(0, Math.min(hardTarget, hardItems.length));
  const normalTarget = totalCount - sampledHard.length;
  const sampledNormal = shuffle(normalItems).slice(0, normalTarget);

  return shuffle([...sampledHard, ...sampledNormal]);
}

// Robust cleanHardTag that safely handles all question shapes without crashing
function cleanHardTag(item) {
  if (typeof item === 'string') return item.replace(/^\[HARD\]\s*/, '');
  if (Array.isArray(item)) {
    // Part B Shape: [ [chunk1, chunk2, chunk3], [target] ]
    if (Array.isArray(item[0]) && Array.isArray(item[1])) {
      const cleanChunks = item[0].map(c => (typeof c === 'string' ? c.replace(/^\[HARD\]\s*/, '') : c));
      const cleanTargets = item[1].map(t => (typeof t === 'string' ? t.replace(/^\[HARD\]\s*/, '') : t));
      return [cleanChunks, cleanTargets];
    }
    // Part C Shape: [ [line1, line2...], "Question text", [accepted_answers] ]
    if (Array.isArray(item[0]) && typeof item[1] === 'string' && Array.isArray(item[2])) {
      const cleanLines = item[0].map(l => (typeof l === 'string' ? l.replace(/^\[HARD\]\s*/, '') : l));
      const cleanQ = item[1].replace(/^\[HARD\]\s*/, '');
      return [cleanLines, cleanQ, item[2]];
    }
    // Part D / F Shape: [ "Prompt text", [answers] ]
    if (typeof item[0] === 'string' && Array.isArray(item[1])) {
      return [item[0].replace(/^\[HARD\]\s*/, ''), item[1]];
    }
  }
  return item;
}

function buildTestSequence(mode, drillPart) {
  activeItems = [];
  if (mode === 'drill') {
    const targetCount = T_CONFIG[drillPart][4];
    const hardCount = Math.min(3, Math.floor(targetCount * 0.25));
    const sampled = sampleTiered(BANK[drillPart], targetCount, hardCount);
    sampled.forEach((item, idx) => activeItems.push({ part: drillPart, data: cleanHardTag(item), origIdx: idx }));
  } else {
    for (const p of 'ABCDEF') {
      const targetCount = T_CONFIG[p][4];
      const hardCount = (p === 'F') ? 1 : 3;
      const sampled = sampleTiered(BANK[p], targetCount, hardCount);
      sampled.forEach((item, idx) => activeItems.push({ part: p, data: cleanHardTag(item), origIdx: idx }));
    }
  }
}

function playCueTone(token) {
  return new Promise(resolve => {
    if (token !== currentSessionToken) return resolve();
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();

      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, actx.currentTime);
      gain.gain.setValueAtTime(0.18, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.35);

      setTimeout(() => {
        try { actx.close(); } catch(e) {}
        if (token === currentSessionToken) resolve();
      }, 380);
    } catch (e) {
      resolve();
    }
  });
}

function speakText(text, isBritish, pitch = 1, rate = 0.95, token) {
  return new Promise(resolve => {
    if (!window.speechSynthesis || token !== currentSessionToken) return resolve();
    if (speechSynthesis.paused) speechSynthesis.resume();

    const u = new SpeechSynthesisUtterance(text);
    const chosenVoice = isBritish ? (voiceGB || voiceUS) : (voiceUS || voiceGB);
    if (chosenVoice) {
      u.voice = chosenVoice;
      u.lang = chosenVoice.lang;
    } else {
      u.lang = isBritish ? 'en-GB' : 'en-US';
    }
    u.pitch = isBritish ? (pitch * 1.06) : (pitch * 0.94);
    u.rate = rate;

    let timer = setTimeout(resolve, 14000);
    u.onend = () => { clearTimeout(timer); resolve(); };
    u.onerror = () => { clearTimeout(timer); resolve(); };

    speechSynthesis.speak(u);
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function playTaskAudio(part, data, i, token) {
  await wait(250);
  if (token !== currentSessionToken) return;

  const isBritish = (i % 2 === 1);

  if (part === 'A' || part === 'E') {
    await speakText(data, isBritish, 1, part === 'E' ? 0.92 : 0.95, token);
  } else if (part === 'B') {
    for (const chunk of data[0]) {
      if (token !== currentSessionToken) return;
      await speakText(chunk, isBritish, 1, 0.95, token);
      await wait(500);
      if (token !== currentSessionToken) return;
    }
  } else if (part === 'C') {
    const [lines, q] = data;
    for (let k = 0; k < lines.length; k++) {
      if (token !== currentSessionToken) return;
      const speakerIsUK = (k % 2 === 1);
      const pitch = speakerIsUK ? 1.15 : 0.92;
      await speakText(lines[k], speakerIsUK, pitch, 0.95, token);
      await wait(350);
      if (token !== currentSessionToken) return;
    }
    if (token !== currentSessionToken) return;
    await speakText("Question. " + q, false, 1, 0.95, token);
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function initRec() {
  if (rec || !SR) return;
  try {
    rec = new SR();
    rec.lang = 'en-IN';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 5;

    rec.onspeechstart = () => { meta.ts = Date.now(); };
    rec.onspeechend = () => { meta.te = Date.now(); };

    rec.onresult = e => {
      let fullFinal = '', fullInterim = '';
      meta.alternatives = [];

      for (let i = e.resultIndex; i < e.results.length; ++i) {
        const res = e.results[i];
        for (let alt = 0; alt < res.length; alt++) {
          if (res[alt] && res[alt].transcript) {
            meta.alternatives.push(res[alt].transcript.trim());
          }
        }
        if (res.isFinal) {
          fullFinal += res[0].transcript + ' ';
          meta.conf = res[0].confidence;
        } else {
          fullInterim += res[0].transcript;
        }
      }

      const combined = (fullFinal + fullInterim).trim();
      const curr = activeItems[n];
      let targetText = '';
      if (curr) {
        targetText = (curr.part === 'A') ? curr.data : (curr.part === 'B' ? curr.data[1][0] : (curr.part === 'C' ? curr.data[2].join(' ') : ''));
      }

      const repairedCombined = phoneticRepair(combined, targetText);
      meta.txt = repairedCombined;
      if ($('ans')) $('ans').value = repairedCombined;
      if ($('note')) $('note').textContent = '';
    };

    rec.onerror = e => {
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        if ($('note')) $('note').textContent = 'Audio note (' + e.error + '). Speak clearly.';
      }
    };

    rec.onend = () => {
      try { rec.started = false; } catch (e) {}
    };
  } catch (err) {}
}

function stopMicImmediately() {
  if (rec) {
    try { rec.abort(); } catch (e) {}
  }
  if ($('recind')) $('recind').classList.remove('live');
}

function startMicCapture() {
  if (!SR) {
    if ($('note')) $('note').textContent = 'Speech recognition requires Chrome or Edge.';

  initRec();
  stopMicImmediately();
  try {
    rec.start();
    if ($('note')) $('note').textContent = 'Recording active. Speak now...';
    if ($('recind')) $('recind').classList.add('live');
  } catch (e) {
    setTimeout(() => {
      try {
        rec.start();
        if ($('note')) $('note').textContent = 'Recording active. Speak now...';
        if ($('recind')) $('recind').classList.add('live');
      } catch (e2) {}
    }, 150);
  }
}

          <option value="E">Part E: Dictation (14 Items)</option>
          <option value="F">Part F: Passage Reconstruction (2 Items)</option>
        </select>
        <button class="sec-sm" style="width:100%;padding:10px;font-weight:700" onclick="launchSession('drill')">Start Section Practice</button>
      </div>
    </div>
  `;
}

function launchSession(mode) {
  try {
    currentMode = mode;
    if (mode === 'drill') {
      selectedDrillPart = $('sectionSelect').value;
      $('modeTag').innerHTML = `<span class="tag-mode tag-drill">Practice: Part ${selectedDrillPart}</span>`;
    } else {
      $('modeTag').innerHTML = `<span class="tag-mode tag-mock">Full Mock</span>`;
    }

    try { initRec(); } catch(err) { console.warn("Mic init skipped:", err); }

    buildTestSequence(currentMode, selectedDrillPart);
    n = 0; ans = []; mt = []; seen = {};
    showItem();
  } catch(e) {
    console.error("Launch error:", e);
    alert("Starting test. Please ensure your browser allows microphone and audio playback.");
  }
}

function ring(sec) {
  return `<div class="center"><span class="timerbox" id="tmn">${String(sec).padStart(2, '0')}</span><div class="mut" style="margin-top:4px">seconds remaining</div></div>`;
}

function bar() {
  const pct = Math.round((100 * n) / activeItems.length);
  return `<div class="statusbar"><span>Item ${Math.min(n + 1, activeItems.length)} of ${activeItems.length}</span><span>${pct}% complete</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
}

function cd(tot, f, token) {
  let t = tot;
  const el = () => $('tmn');
  tm = setInterval(() => {
    if (token !== currentSessionToken) {
      clearInterval(tm);
      return;
    }
    t--;
    if (el()) el().textContent = String(Math.max(t, 0)).padStart(2, '0');
    if (t <= 0) {
      clearInterval(tm);
      f();
    }
  }, 1000);
}

function showItem() {
  currentSessionToken++;
  const activeToken = currentSessionToken;
  clearInterval(tm);
  window.speechSynthesis.cancel();
  stopMicImmediately();

  if (n >= activeItems.length) return finish();

  const curr = activeItems[n];
  const p = curr.part;
  const data = curr.data;
  const t = T_CONFIG[p];

  if (!seen[p]) {
    seen[p] = 1;
    $('app').innerHTML = bar() + `
      <div class="panel">
        <div class="part-hd"><b>Part ${p}: ${t[0]}</b><span>${t[1]}</span></div>
        <div class="instr">${t[2]}</div>
        <div class="btnrow"><button class="pri" onclick="showItem()">Continue</button></div>
      </div>
    `;
    return;
  }

  let h = bar() + `<div class="panel"><div class="part-hd"><b>Part ${p}: ${t[0]}</b><span>${t[1]}</span></div>`;

  if (p === 'D') {
    h += `
      <p class="qtext">${esc(data[0])}</p>
      ${ring(25)}
      <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type one word">
      <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
    `;
  } else if (p === 'F') {
    h += `
      <div id="fb">
        <div class="no-copy" oncopy="return false" oncut="return false" oncontextmenu="return false">
          <p class="qtext" style="line-height:1.6;background:#FAFBFD;padding:16px;border:1px solid var(--line);border-radius:4px">${esc(data[0])}</p>
        </div>
        <p class="mut">This passage will disappear after 30 seconds. Do not write or take notes.</p>
        ${ring(30)}
        <div class="btnrow"><button class="pri" onclick="fw()">I Have Finished Reading</button></div>
      </div>
    `;
  } else {
    h += `
      <div class="rec" id="recind">
        <span class="dot"></span>
        <span id="st">Playing audio…</span>
      </div>
      ${ring(t[3] || 1)}
    `;

    if (p === 'E') {
      h += `<textarea id="ans" autocomplete="off" spellcheck="false" placeholder="Type the sentence exactly as you heard it"></textarea>`;
    } else {
      h += `
        <div style="margin:12px 0 6px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <label class="mut" style="font-size:.78rem;font-weight:700;text-transform:uppercase">Spoken Response (Voice Captured):</label>
            <button class="warn-sm" onclick="speakAgain()" title="Clear and record again">↺ Speak Again</button>
          </div>
          <input id="ans" autocomplete="off" placeholder="Your spoken words will appear here automatically..." readonly style="background:#F7F9FA;cursor:default;color:#002E3B;font-weight:600">
        </div>
        <p id="note" class="mut" style="min-height:16px"></p>
      `;
    }

    h += `<div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>`;
  }

  $('app').innerHTML = h + '</div>';

  if (p === 'D') {
    cd(25, nx, activeToken);
    $('ans').focus();
  } else if (p === 'F') {
    cd(30, fw, activeToken);
  } else {
    (async () => {
      await playTaskAudio(p, data, n, activeToken);
      if (activeToken !== currentSessionToken) return;

      if (p === 'A' || p === 'B' || p === 'C') {
        await playCueTone(activeToken);
      }
      if (activeToken !== currentSessionToken) return;

      await wait(400);
      if (activeToken !== currentSessionToken) return;

      $('st').textContent = (p === 'E') ? 'Type now' : 'Respond now (Microphone Active)';
      meta.t0 = Date.now();

      cd(t[3], nx, activeToken);

      if (p === 'E') {
        $('ans').focus();
      } else {
        if (SR) {
          startMicCapture();
        }
      }
    })();
  }
}

function fw() {
  currentSessionToken++;
  clearInterval(tm);
  stopMicImmediately();
  $('fb').innerHTML = `
    <p class="mut">Rewrite the passage in your own words below.</p>
    ${ring(90)}
    <textarea id="ans" spellcheck="false" placeholder="Type your answer here"></textarea>
    <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
  `;
  cd(90, nx, currentSessionToken);
  $('ans').focus();
}

function nx() {
  currentSessionToken++;
  clearInterval(tm);
  window.speechSynthesis.cancel();
  stopMicImmediately();

  ans.push($('ans') ? $('ans').value : '');
  mt.push(meta);
  meta = {};
  n++;
  showItem();
}

function mech(v) {
  const s = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  if (!s.length) return 0;
  return s.filter(x => /^[A-Z]/.test(x) && /[.!?]$/.test(x)).length / s.length;
}

function matchWord(refW, userW) {
  if (refW === userW) return true;
  if (refW.endsWith('ed') && refW.slice(0, -2) === userW) return true;
  if (refW.endsWith('d') && refW.slice(0, -1) === userW) return true;
  if (userW.endsWith('ed') && userW.slice(0, -2) === refW) return true;
  if (refW.endsWith('s') && refW.slice(0, -1) === userW) return true;
  if (userW.endsWith('s') && userW.slice(0, -1) === refW) return true;
  if (Math.abs(refW.length - userW.length) <= 1 && refW.length >= 3) {
    return (lcs(refW, userW) / Math.max(refW.length, userW.length)) >= 0.8;
  }
  return false;
}

function wordLcs(targetWords, userWords) {
  const m = targetWords.length, n = userWords.length;
  const dp = Array(m + 1).fill(0).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (matchWord(targetWords[i - 1], userWords[j - 1])) {
        dp[i][j] = dp[i - 1][j - 1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
  }
  return dp[m][n];
}

function flexibleRat(targetWords, userWords) {
  const common = wordLcs(targetWords, userWords);
  return common / Math.max(targetWords.length, userWords.length, 1);
}

function flexibleBag(targetWords, userWords) {
  const c = [...userWords];
  let matches = 0;
  targetWords.forEach(tw => {
    const idx = c.findIndex(uw => matchWord(tw, uw));
    if (idx > -1) {
      c.splice(idx, 1);
      matches++;
    }
  });
  return matches / (targetWords.length || 1);
}

function scoreItem(curr, v, m) {
  const p = curr.part;
  const x = curr.data;
  m = m || {};

  const cleanAns = (v || '').trim();
  if (!cleanAns) {
    if (p === 'A' || p === 'B') return { sm: 0, vo: 0 };
    if (p === 'C') return { c: 0 };
    if (p === 'D') return { d: 0 };
    if (p === 'E') return { lis: 0, sp: 0, cap: 0, pu: 0 };
    if (p === 'F') return { cov: 0, con: 0, mech: 0, va: 0 };
  }

  const candidateTranscripts = [cleanAns];
  if (m.alternatives && Array.isArray(m.alternatives)) {
    m.alternatives.forEach(alt => {
      if (!candidateTranscripts.includes(alt)) candidateTranscripts.push(alt);
    });
  }

  if (p === 'A' || p === 'B') {
    const targetNorms = (p === 'A') ? [norm(x)] : x[1].map(norm);
    let bestSm = 0, bestVo = 0;

    candidateTranscripts.forEach(trans => {
      const userNorm = norm(trans);
      targetNorms.forEach(tNorm => {
        const sm = flexibleRat(tNorm, userNorm);
        const vo = flexibleBag(tNorm, userNorm);
        if (sm > bestSm) bestSm = sm;
        if (vo > bestVo) bestVo = vo;
      });
    });

    return {
      sm: bestSm,
      vo: bestVo
    };
  }

  if (p === 'C') {
    const isCorrect = candidateTranscripts.some(trans => {
      const transLo = trans.toLowerCase();
      const transNorm = norm(trans);
      return x[2].some(k => transNorm.includes(k) || (k.length > 2 && transLo.includes(k)));
    });
    return { c: isCorrect ? 1.0 : 0.0 };
  }

  if (p === 'D') {
    const cleaned = fix(cleanAns).toLowerCase();
    const isCorrect = x[1].some(acc => acc.toLowerCase() === cleaned);
    return { d: isCorrect ? 1.0 : 0.0 };
  }

  if (p === 'E') {
    const a = tok(x), b = tok(cleanAns);
    const pa = a.filter(t => /^[^A-Za-z0-9']/.test(t));
    const pb = b.filter(t => /^[^A-Za-z0-9']/.test(t));
    return {
      lis: flexibleBag(norm(x), norm(cleanAns)),
      sp: rat(norm(x), norm(cleanAns)),
      cap: bag(a.filter(t => /^[A-Z]/.test(t)), b),
      pu: pa.length ? (lcs(pa, pb) / Math.max(pa.length, pb.length, 1)) : 1.0
    };
  }

  const lo = cleanAns.toLowerCase(), w = norm(cleanAns);
  const targetWords = norm(x[0]);
  const cov = x[1].filter(g => g.some(k => lo.includes(k))).length / x[1].length;
  const ln = cl(w.length / Math.max(targetWords.length * 0.55, 1));
  const ss = cleanAns.split(/(?<=[.!?])\s+/).filter(Boolean);
  const lk = ss.filter(z => /\b(because|but|and|so|although|while|which|who|when|after|before|then|however|therefore)\b/i.test(z)).length / (ss.length || 1);

  return {
    cov: cov,
    con: cl(cov * 0.7 + ln * 0.3),
    mech: mech(cleanAns),
    va: 0.5 * cl(new Set(w).size / (w.length || 1) / 0.75) + 0.5 * cl(lk / 0.45)
  };
}

const K_SKILLS = {
  Speaking: [
    ['Sentence mastery', 'A, B', 'AB', 'sm', 0.65],
    ['Vocabulary selection', 'A, B', 'AB', 'vo', 0.35]
  ],
  Listening: [
    ['Conversation comprehension', 'C', 'C', 'c', 0.50],
    ['Spoken sentence retention', 'E', 'E', 'lis', 0.50]
  ],
  Reading: [
    ['Vocabulary in context', 'D', 'D', 'd', 0.60],
    ['Passage comprehension', 'F', 'F', 'cov', 0.40]
  ],
  Writing: [
    ['Dictation accuracy & spelling', 'E', 'E', 'sp', 0.30],
    ['Punctuation & capitalization', 'E', 'E', 'pu', 0.15],
    ['Reconstruction content & sequence', 'F', 'F', 'con', 0.30],
    ['Grammar & mechanics', 'F', 'F', 'mech', 0.15],
    ['Vocabulary variety', 'F', 'F', 'va', 0.10]
  ]
};

const band = o => o < 32 ? 'A1' : o < 43 ? 'A2' : o < 56 ? 'B1' : o < 68 ? 'B2' : o < 78 ? 'C1' : 'C2';
const toGSE = s => Math.round(10 + ((s - 20) / 60) * 80);

function calculateVersantScore(pct) {
  if (pct <= 0.02) return 20;
  if (pct >= 0.98) return 80;
  return Math.round(20 + 60 * pct);
}

function lcs(a,b){const d=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[a.length][b.length]}
const rat=(a,b)=>lcs(a,b)/Math.max(a.length,b.length,1);
const cl=x=>Math.max(0,Math.min(1,x));
const bag=(t,r)=>{const c=[...r];let k=0;t.forEach(w=>{const i=c.indexOf(w);if(i>-1){c.splice(i,1);k++}});return k/(t.length||1)};
function gauge(label,val){const sco = val == null ? 20 : calculateVersantScore(val); return `<tr><td>${label}</td><td><strong>${sco}</strong> / 80 (${Math.round((val||0)*100)}%)</td></tr>`}

function finish() {
  const it = { A: [], B: [], C: [], D: [], E: [], F: [] };
  let rv = '';

  activeItems.forEach((curr, k) => {
    const v = ans[k] || '';
    const o = scoreItem(curr, v, mt[k]);
    it[curr.part].push(o);

    const c = (curr.part === 'A' || curr.part === 'E') ? curr.data
      : (curr.part === 'B') ? curr.data[1][0]
      : (curr.part === 'C') ? curr.data[1] + ' → ' + curr.data[2].join('/')
      : (curr.part === 'D') ? curr.data[0] + ' → ' + curr.data[1].join('/')
      : curr.data[0];

    rv += `<tr><td>${curr.part}${k + 1}</td><td>${esc(v || '(blank)')}</td><td>${esc(c)}</td><td>${Object.values(o).map(z => Math.round(z * 100) + '%').join(' / ')}</td></tr>`;
  });

  const av = (ps, key) => {
    const z = ps.flatMap(p => it[p].map(o => o[key])).filter(z => z != null);
    return z.length ? z.reduce((a, b) => a + b, 0) / z.length : null;
  };

  let cards = '', skillPct = {}, subscores = {}, totalScore = 0;
  for (const s in K_SKILLS) {
    const rows = K_SKILLS[s].map(r => ({ l: r[0], f: r[1], w: r[4], v: av(r[2].split(''), r[3]) }));
    const ok = rows.filter(r => r.v != null);
    const rawPct = ok.length ? ok.reduce((a, r) => a + (r.v||0) * r.w, 0) / ok.reduce((a, r) => a + r.w, 0) : 0;
    
    const sco = calculateVersantScore(rawPct);
    skillPct[s] = rawPct;
    subscores[s] = sco;
    totalScore += sco;

    cards += `
      <div class="panel">
        <div class="part-hd"><b>${s}</b><span class="badge">${sco} / 80 &nbsp;·&nbsp; GSE: ${toGSE(sco)}/90 &nbsp;·&nbsp; ${band(sco)}</span></div>
        <table><tr><th>Sub-skill</th><th>Score</th></tr>${rows.map(r => gauge(r.l, r.v)).join('')}</table>
      </div>
    `;
  }

  const partDirectScores = {};
  for (const p of 'ABCDEF') {
    if (!it[p] || !it[p].length) continue;
    let pPct = 0;
    if (p === 'A' || p === 'B') {
      const sm = av([p], 'sm') || 0, vo = av([p], 'vo') || 0;
      pPct = (sm * 0.65) + (vo * 0.35);
    } else if (p === 'C') {
      pPct = av(['C'], 'c') || 0;
    } else if (p === 'D') {
      pPct = av(['D'], 'd') || 0;
    } else if (p === 'E') {
      const sp = av(['E'], 'sp') || 0, lis = av(['E'], 'lis') || 0, pu = av(['E'], 'pu') || 0;
      pPct = (sp * 0.45) + (lis * 0.40) + (pu * 0.15);
    } else if (p === 'F') {
      const cov = av(['F'], 'cov') || 0, con = av(['F'], 'con') || 0, mech = av(['F'], 'mech') || 0;
      pPct = (cov * 0.40) + (con * 0.40) + (mech * 0.20);
    }
    partDirectScores[p] = calculateVersantScore(pPct);
  }

  let partSummaryRows = Object.keys(partDirectScores).map(p => {
    return `<tr><td>Part ${p} — ${T_CONFIG[p][0]}</td><td>${it[p].length} Items</td><td><strong>${partDirectScores[p]}</strong> / 80</td></tr>`;
  }).join('');

  const O = Math.round(totalScore / 4);

  let lsrw = '';
  for (const s2 in K_SKILLS) {
    const sco = subscores[s2];
    lsrw += `
      <div class="skill-card">
        <div class="sk-name">${s2}</div>
        <div class="sk-num">${sco}<span style="font-size:.9rem;color:var(--mut)"> / 80</span></div>
        <div class="sk-bar"><i style="width:${Math.round(100 * (sco - 20) / 60)}%"></i></div>
        <div class="mut" style="margin-top:4px">GSE: ${toGSE(sco)} · ${band(sco)}</div>
      </div>
    `;
  }

  $('app').innerHTML = `
    <div class="score-hd">
      <div class="lbl">Assessment Overall Score</div>
      <div class="num">${O}</div>
      <div class="lbl">out of 80 &nbsp;·&nbsp; ${band(O)}</div>
      <div class="score-sub">Global Scale of English (GSE): ${toGSE(O)} / 90</div>
    </div>
    <div class="lsrw">${lsrw}</div>

    <div class="panel">
      <div class="part-hd"><b>Section-by-Section Scores (Direct 20–80 Scale)</b><span>Performance by Part</span></div>
      <table>
        <tr><th>Section</th><th>Length</th><th>Direct Score</th></tr>
        ${partSummaryRows}
      </table>
    </div>

    <div class="panel"><details open><summary>Core Skill Diagnostics</summary><div style="margin-top:12px">${cards}</div></details></div>
    <div class="panel"><details><summary>Review Item Audit (${activeItems.length} total)</summary><div style="overflow-x:auto;margin-top:10px"><table><tr><th>Item</th><th>Your Answer</th><th>Target</th><th>Item Accuracy</th></tr>${rv}</table></div></details></div>
    <div class="btnrow" style="margin:16px">
      <button onclick="window.print()">Print Score Report (PDF)</button>
      <button class="pri" onclick="intro()">Return to Home</button>
    </div>
  `;
}

intro();
</script>
